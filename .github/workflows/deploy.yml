name: CI + Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint + typecheck + tests + db gates + build + bundle scan + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Database gates (PLAN P1.10). Local PGlite only: no secret, no live Supabase. A red gate fails
      # `verify`, and `deploy` needs `verify`, so a red gate blocks the Pages deploy.
      - name: Migration guard (db:check)
        run: npm run db:check
      - name: Database gate (db:gate)
        run: npm run db:gate
        timeout-minutes: 5
      # A gate nobody has seen fail is not a gate: every sabotage must turn db:gate RED.
      # Public-repo ubuntu-latest has 4 vCPUs, so 4 parallel gate runs (about 1.5-2 min expected;
      # 52 s at 4 jobs on the desktop).
      - name: Prove the gate RED (db:gate:prove-red)
        run: npm run db:gate:prove-red
        env:
          PROVE_RED_JOBS: '4'
        timeout-minutes: 10
      - run: npm run build
      # Secret boundary (PLAN P2.1): every byte in dist/ is public. Scan the real build output for
      # secret-looking values (sk_live_/sk_test_/whsec_/sk-ant-/service_role, a service-role JWT) and
      # server-only env names. A finding fails `verify`, so it never reaches the Pages artifact.
      - name: Bundle secret scan (check:bundle)
        run: npm run check:bundle
      # e2e (PLAN P2.4): Playwright against the dist/ just built and scanned, served with GitHub Pages
      # semantics (e2e/support/pages-server.mjs: a file, else 404.html with status 404), so the SPA
      # fallback is really exercised. E2E_PREBUILT=1 tests THIS artifact, the one uploaded below, with
      # no second build. No backend and no secret: the build has no Supabase env (local-only mode).
      # Only the headless shell is installed, cached per Playwright version; system deps come from apt.
      - name: Playwright version (browser cache key)
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - name: Install chromium (headless shell + system deps)
        run: npx playwright install --with-deps --only-shell chromium
      - name: e2e against the production build (npm run e2e)
        run: npm run e2e
        env:
          E2E_PREBUILT: '1'
        timeout-minutes: 5
      - name: Upload e2e failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # Only main deploys; a PR proves the build and stops there.
  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
